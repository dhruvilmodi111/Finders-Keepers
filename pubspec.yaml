name: finders_keepers
description: "Finders Keepers - Campus Lost and Found Mobile Application for VIT"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.0.0

  # Typography & Design
  google_fonts: ^6.2.1

  # Firebase & Auth
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Map & Location (OpenStreetMap)
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

  # UI Utilities & Shimmer
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  crypto: ^3.0.3
  uuid: ^4.4.0
  image_picker: ^1.1.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
